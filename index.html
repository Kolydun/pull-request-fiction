<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your Energy — find exercises, build your workout and stay motivated." />
    <title>Your Energy</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Header -->
    <header id="header" class="header"></header>

    <main>
      <!-- Hero banner -->
      <section id="hero" class="hero"></section>

      <!-- Filters + categories + search + exercises -->
      <section id="filters" class="filters container"></section>
      <section id="categories" class="categories container"></section>
      <div id="search" class="search container"></div>
      <section id="exercises" class="exercises container"></section>

      <!-- Quote of the day -->
      <section id="quote" class="quote container"></section>
    </main>

    <!-- Footer -->
    <footer id="footer" class="footer"></footer>

    <!-- Global UI -->
    <div id="loader" class="loader is-hidden"></div>
    <button id="scroll-up" class="scroll-up is-hidden" type="button" aria-label="Scroll to top"></button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
