<header class="header" id="header">
  <div class="header__inner">
    <a class="header__logo" href="./index.html" aria-label="YOUR ENERGY">
      <svg
        class="header__logo-icon"
        width="132"
        height="14"
        aria-hidden="true"
        focusable="false"
      >
        <use href="./images/icons/icons.svg#icon-your-energy"></use>
      </svg>
    </a>

    <button
      class="header__burger"
      type="button"
      aria-expanded="false"
      aria-controls="header-menu"
      aria-label="Open menu"
    >
      <svg
        class="header__burger-icon"
        width="32"
        height="32"
        aria-hidden="true"
        focusable="false"
      >
        <use href="./images/icons/icons.svg#burger"></use>
      </svg>
    </button>

    <div class="header__panel" id="header-menu">
      <button class="header__close" type="button" aria-label="Close menu">
        <svg
          class="header__close-icon"
          width="32"
          height="32"
          aria-hidden="true"
          focusable="false"
        >
          <use href="./images/icons/icons.svg#close"></use>
        </svg>
      </button>

      <nav class="header__nav" aria-label="Main">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a class="header__link" href="./index.html">Home</a>
          </li>
          <li class="header__nav-item">
            <a class="header__link" href="./favorites.html">Favorites</a>
          </li>
        </ul>
      </nav>

      <ul class="header__socials" aria-label="Social media">
        <li class="header__socials-item">
          <a
            class="header__socials-link"
            href="https://www.facebook.com/goITclub/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <svg
              class="header__icon"
              width="28"
              height="28"
              aria-hidden="true"
              focusable="false"
            >
              <use href="./images/icons/icons.svg#facebook"></use>
            </svg>
          </a>
        </li>
        <li class="header__socials-item">
          <a
            class="header__socials-link"
            href="https://www.instagram.com/goitclub/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <svg
              class="header__icon"
              width="28"
              height="28"
              aria-hidden="true"
              focusable="false"
            >
              <use href="./images/icons/icons.svg#instagram"></use>
            </svg>
          </a>
        </li>
        <li class="header__socials-item">
          <a
            class="header__socials-link"
            href="https://www.youtube.com/c/GoIT"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
          >
            <svg
              class="header__icon"
              width="28"
              height="28"
              aria-hidden="true"
              focusable="false"
            >
              <use href="./images/icons/icons.svg#youtube"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
