<section class="exercises is-hidden" id="exercises">
  <div class="container">
    <div class="exercises__head">
      <h2 class="exercises__title">
        Exercises <span class="exercises__crumb"></span>
      </h2>
      <form class="exercises__form" role="search">
        <label class="visually-hidden" for="exercise-search"
          >Search exercises</label
        >
        <input
          class="exercises__input"
          id="exercise-search"
          type="text"
          name="keyword"
          placeholder="Search"
          autocomplete="off"
        />
        <button
          class="exercises__clear is-hidden"
          type="button"
          aria-label="Clear search"
        >
          <img src="./images/icon-clear.svg" width="18" height="18" alt="" />
        </button>
        <button class="exercises__submit" type="submit" aria-label="Search">
          <img src="./images/icon-search.svg" width="18" height="18" alt="" />
        </button>
      </form>
    </div>

    <ul class="exercises__list"></ul>
    <p class="exercises__empty is-hidden" role="status">No exercises found.</p>
    <div class="pagination"></div>
  </div>
</section>
