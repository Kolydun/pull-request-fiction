<section id="hero" class="hero">
  <div class="container hero__container">
    <div class="hero__content">
      <h1 class="hero__title">
        <img
          class="hero__sun"
          src="./images/hero/sun.svg"
          alt=""
          aria-hidden="true"
          width="60"
          height="60"
        />
        Get <em class="hero__accent">Body</em> in shape, Stay healthy
      </h1>
      <p class="hero__text">
        Transform your physique and embrace a healthier lifestyle with our
        comprehensive fitness and nutrition support.
      </p>
    </div>

    <div class="hero__aside">
      <picture class="hero__thumb">
        <source
          type="image/webp"
          srcset="
            ./images/hero/hero-small.webp    1x,
            ./images/hero/hero-small@2x.webp 2x
          "
        />
        <img
          class="hero__thumb-img"
          src="./images/hero/hero-small.jpg"
          srcset="./images/hero/hero-small@2x.jpg 2x"
          alt="Two women stretching together on the grass"
          width="168"
          height="100"
          loading="lazy"
        />
      </picture>

      <ul class="hero__tags">
        <li class="hero__tag">#Sport</li>
        <li class="hero__tag">#Healthy</li>
        <li class="hero__tag">#Workout</li>
        <li class="hero__tag">#Diet</li>
      </ul>
    </div>

    <picture class="hero__picture">
      <source
        media="(min-width: 1440px)"
        type="image/webp"
        srcset="
          ./images/hero/hero-desktop.webp    1x,
          ./images/hero/hero-desktop@2x.webp 2x
        "
      />
      <source
        media="(min-width: 768px)"
        type="image/webp"
        srcset="
          ./images/hero/hero-tablet.webp    1x,
          ./images/hero/hero-tablet@2x.webp 2x
        "
      />
      <source
        type="image/webp"
        srcset="
          ./images/hero/hero-mobile.webp    1x,
          ./images/hero/hero-mobile@2x.webp 2x
        "
      />
      <img
        class="hero__img"
        src="./images/hero/hero-mobile.jpg"
        srcset="./images/hero/hero-mobile@2x.jpg 2x"
        alt="Two smiling women giving each other a high five during an outdoor workout by the lake"
        width="335"
        height="460"
        fetchpriority="high"
      />
    </picture>
  </div>
</section>
