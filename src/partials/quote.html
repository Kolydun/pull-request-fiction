<aside class="quote" aria-label="Daily motivation">
  <section class="quote__card" aria-labelledby="quote-heading">
    <div class="quote__top">
      <span class="quote__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4 14 5-5m6 6 5-5M7 5l12 12M5 7l2-2m10 12 2-2M3 13l-1 2 4 4 2-1" />
        </svg>
      </span>
      <h2 class="quote__heading" id="quote-heading">Quote of the day</h2>
      <svg class="quote__quotation-mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="currentColor">
        <path d="M10.6 5.4C6.3 7 4.1 10.1 4.1 14v4.5h7.2V11H8.6c.4-1.5 1.5-2.6 3.1-3.3l-1.1-2.3Zm10 0C16.3 7 14.1 10.1 14.1 14v4.5h7.2V11h-2.7c.4-1.5 1.5-2.6 3.1-3.3l-1.1-2.3Z" />
      </svg>
    </div>
    <blockquote class="quote__body">
      <p class="quote__text" data-quote-text>Loading your daily quote...</p>
      <footer class="quote__author" data-quote-author></footer>
    </blockquote>
    <p class="quote__error" data-quote-error role="status" hidden></p>
  </section>

  <img class="quote__image" src="./images/quote-workout.png" alt="Two women resting after a workout" loading="lazy" />
  <section class="quote__minutes" aria-labelledby="quote-minutes-heading">
      <div class="quote__minutes-title-row">
        <span class="quote__minutes-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9v6M18 9v6M3 10v4m18-4v4M9 12h6M3 12h3m12 0h3" />
          </svg>
        </span>
        <span class="quote__minutes-heading-group">
          <h2 class="quote__minutes-heading" id="quote-minutes-heading">110 min</h2>
          <span class="quote__minutes-subtitle">Daily norm of sports</span>
        </span>
      </div>
      <p class="quote__minutes-description">The World Health Organization recommends at least 150 minutes of moderate-intensity aerobic physical activity per week for adults. Even short workouts help build a consistent, healthy routine.</p>
  </section>
</aside>
