<section class="categories" id="categories">
  <div class="container">
    <div class="categories__head">
      <h2 class="categories__title">
        Exercises <span class="categories__crumb"></span>
      </h2>
      <form class="exercises__form is-hidden" role="search">
        <label class="visually-hidden" for="exercise-search"
          >Search exercises</label
        >
        <input
          class="exercises__input"
          id="exercise-search"
          type="text"
          name="keyword"
          placeholder="Search"
          autocomplete="off"
        />
        <button
          class="exercises__clear is-hidden"
          type="button"
          aria-label="Clear search"
        >
          <img
            src="./images/icons/icon-clear.svg"
            width="18"
            height="18"
            alt=""
          />
        </button>
        <button class="exercises__submit" type="submit" aria-label="Search">
          <img
            src="./images/icons/icon-search.svg"
            width="18"
            height="18"
            alt=""
          />
        </button>
      </form>
      <ul class="categories__filters">
        <li>
          <button
            class="categories__filter is-active"
            type="button"
            data-filter="Muscles"
            aria-pressed="true"
          >
            Muscles
          </button>
        </li>
        <li>
          <button
            class="categories__filter"
            type="button"
            data-filter="Body parts"
            aria-pressed="false"
          >
            Body parts
          </button>
        </li>
        <li>
          <button
            class="categories__filter"
            type="button"
            data-filter="Equipment"
            aria-pressed="false"
          >
            Equipment
          </button>
        </li>
      </ul>
    </div>

    <div class="categories__body">
      <ul class="categories__list"></ul>
      <p class="categories__empty is-hidden" role="status">
        No categories found.
      </p>
      <div class="categories__pagination"></div>
    </div>
  </div>
</section>
